name: Publish UiPath Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar UiPath CLI
        run: |
          Invoke-WebRequest "https://github.com/UiPath/uipathcli/releases/latest/download/uipathcli-windows-amd64.zip" -OutFile "uipathcli.zip"
          Expand-Archive -Force -Path "uipathcli.zip" -DestinationPath "."
        shell: pwsh

      - name: Configurar UiPath CLI
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.uipath"
          $lines = @(
            "---",
            "profiles:",
            "  - name: default",
            "    organization: ${{ secrets.UIPATH_ACCOUNT_NAME }}",
            "    tenant: ${{ secrets.UIPATH_TENANT_NAME }}",
            "    auth:",
            "      pat: ${{ secrets.UIPATH_PAT }}"
          )
          $lines | Out-File "$env:USERPROFILE\.uipath\config" -Encoding utf8
        shell: pwsh

      - name: Pack projeto UiPath
        run: |
          dotnet tool install --global UiPath.CLI.Windows
          uipcli package pack project.json `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"
        shell: pwsh

      - name: Publicar no Orchestrator
        run: |
          .\uipath orchestrator packages upload `
            --organization ${{ secrets.UIPATH_ACCOUNT_NAME }} `
            --tenant ${{ secrets.UIPATH_TENANT_NAME }} `
            --folder "${{ secrets.UIPATH_FOLDER }}" `
            --path "${{ github.workspace }}\output\*.nupkg"
        shell: pwsh
