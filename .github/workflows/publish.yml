name: Publish UiPath Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Pack projeto UiPath
        run: |
          dotnet tool install --global UiPath.CLI.Windows
          uipcli package pack project.json `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"
        shell: pwsh

      - name: Instalar uipathcli
        run: |
          Invoke-WebRequest "https://github.com/UiPath/uipathcli/releases/latest/download/uipathcli-windows-amd64.zip" -OutFile "uipathcli.zip"
          Expand-Archive -Force -Path "uipathcli.zip" -DestinationPath "${{ github.workspace }}\uipathcli"
        shell: pwsh

      - name: Publicar no Orchestrator
        run: |
          ${{ github.workspace }}\uipathcli\uipath.exe orchestrator libraries upload-package --help
        shell: pwsh
