name: Publish UiPath Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Pack projeto UiPath
        run: |
          dotnet tool install --global UiPath.CLI.Windows
          uipcli package pack project.json `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"
        shell: pwsh

      - name: Publicar no Orchestrator
        run: |
          $token = "${{ secrets.UIPATH_PAT }}"
          $file = Get-Item "${{ github.workspace }}\output\*.nupkg"
          $uri = "https://cloud.uipath.com/${{ secrets.UIPATH_ACCOUNT_NAME }}/${{ secrets.UIPATH_TENANT_NAME }}/orchestrator_/odata/Processes/UiPath.Server.Configuration.OData.UploadPackage"
          $headers = @{ Authorization = "Bearer $token" }
          $form = @{ file = Get-Item $file.FullName }
          Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Form $form
        shell: pwsh
