name: Publish UiPath Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar UiPath CLI
        # Substituímos o download manual pela ferramenta dotnet, que é mais estável
        run: dotnet tool install --global UiPath.CLI.Windows
        shell: pwsh

      - name: Configurar UiPath CLI
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.uipath"
          # CORREÇÃO: Adicionado o "-" antes de name para criar uma lista (sequence)
          $lines = @(
            "profiles:",
            "  - name: default",
            "    organization: ${{ secrets.UIPATH_ACCOUNT_NAME }}",
            "    tenant: ${{ secrets.UIPATH_TENANT_NAME }}",
            "    auth:",
            "      pat: ${{ secrets.UIPATH_PAT }}"
          )
          $lines | Out-File "$env:USERPROFILE\.uipath\config" -Encoding utf8
        shell: pwsh

      - name: Pack projeto UiPath
        run: |
          # Usando o comando uipcli instalado via dotnet tool
          uipcli package pack project.json `
            --output "${{ github.workspace }}\output" `
            --version "1.0.${{ github.run_number }}"
        shell: pwsh

      - name: Publicar no Orchestrator
        run: |
          # Removido o ".\" pois agora usamos o comando global e o perfil default
          uipcli orchestrator packages upload `
            --folder "${{ secrets.UIPATH_FOLDER }}" `
            --path "${{ github.workspace }}\output\*.nupkg"
        shell: pwsh
